<style>
  nav a.active {
    background-color: aqua;
  }
</style>

<header
  class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom bg-black"
>
  <a
    href="/"
    class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none text-light"
  >
    <svg
      class="bi me-2"
      width="40"
      height="32"
      aria-hidden="true"
      href="../../../../../public/favicon.ico"
    ></svg>
    <span class="fs-4">Angular</span>
  </a>
  <ul class="nav nav-pills">
    <li class="nav-item">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
        aria-current="page"
        >Counter</a
      >
    </li>
    <li class="nav-item">
      <a [routerLink]="['/hero']" [routerLinkActive]="'active'" class="nav-link"
        >Hero</a
      >
    </li>
    <li class="nav-item">
      <a
        [routerLink]="['/drangonball']"
        [routerLinkActive]="'active'"
        class="nav-link"
        >Dragon Ball</a
      >
    </li>
    <li class="nav-item">
      <a
        [routerLink]="['/daragonballsuper']"
        [routerLinkActive]="'active'"
        class="nav-link"
        >Dragon Ball super</a
      >
    </li>
  </ul>
</header>
