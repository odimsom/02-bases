<div class="container mt-4">
  <h1>Agregar Character: {{ Name() }}</h1>
  <form class="mb-3">
    <div class="mb-3">
      <label for="characterName" class="form-label">Nombre</label>
      <input
        type="text"
        class="form-control"
        id="characterName"
        placeholder="Ingrese el nombre del personaje"
        [value]="Name()"
        (change)="Name.set(txtName.value)"
        (input)="Name.set(txtName.value)"
        #txtName
      />
    </div>
    <div class="mb-3">
      <label for="characterPower" class="form-label">Poder</label>
      <input
        type="number"
        class="form-control"
        id="characterPower"
        placeholder="Ingrese el poder del personaje"
        [value]="Power()"
        (change)="Power.set(+numberPower.value)"
        (input)="Power.set(+numberPower.value)"
        #numberPower
      />
    </div>
    <button (click)="ChangeCharacter()" type="button" class="btn btn-primary">
      Agregar
    </button>
  </form>

  <h2>Lista de Personajes</h2>
  <ol class="list-group">
    @for (character of characters(); track character.id) { @if (character.power
    > 1000) {
    <li class="list-group-item">
      Character: {{ character.name }} - Poder:
      <strong
        [class.text-danger]="character.power > 9000"
        [class.text-primary]="character.power < 9000"
        >{{ character.power }}</strong
      >
    </li>
    }@else {
    <li>
      <strong>este personaje no silve</strong>
    </li>
    } }
  </ol>
</div>
